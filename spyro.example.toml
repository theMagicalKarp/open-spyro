# make native-run's settings: copy to spyro.toml (gitignored) and edit.
# Every key is optional; flags in NATIVE_ARGS override these
# (--set debug.fast=true, or the short forms --fast, --memcard, ...).
disc = "iso/Spyro the Dragon (USA).cue" # your .cue, relative to this file

[memcard]
port1 = "card1.mcd" # "none" = empty, unset = card1.mcd in the data dir
# port2 = "card2.mcd"

[debug]
fast = false       # true: no 59.94 Hz frame limiter
log_level = "info" # "debug", "info", "warn" or "error"
