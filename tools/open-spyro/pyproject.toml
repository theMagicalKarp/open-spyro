[project]
name = "open-spyro"
version = "0.1.0"
description = "Build tooling for the open-spyro byte-matching decompilation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
open-spyro = "open_spyro.cli:app"

[dependency-groups]
dev = [
    "clang-format>=21,<22",
    "pytest>=8",
    "ruff>=0.6",
    "ty",
]
# Disassembly toolchain for `make split` (locked transitive deps via uv.lock).
# Both the host (`uv run --project tools/open-spyro`) and the Docker image
# (`uv export | uv pip install --system`, see tools/Dockerfile) install it from
# the shared uv.lock, so versions never drift between the two.
split = [
    "splat64[mips]==0.41.0",
    "spimdisasm==1.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_spyro"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer uses `typer.Option(...)` / `typer.Argument(...)` as default values.
ignore = ["B008"]

[tool.ty.environment]
root = ["./src"]
