    gamestate-0xC UPDATE half. Re-measured register-anchored: 2020 orig vs 2008
    built insns, MISMATCH 230 over 114 regions, running positional offset -12,
    only 171/2020 words positionally byte-identical. The offset profile names
    the dominant residue: a single 7-insn DELETE at orig insn 164 (0x8007B2B0)
    drives the offset to -7 and it never returns to 0, so ~1,850 insns score no
    positional credit. That is R1, and this session read its mechanism off the
    gcc 2.7.2 jump.c source. R1 is NOT a block-content problem: arm 1's and arm
    3's then-blocks are BYTE-IDENTICAL in the original (164-170 == 278-284,
    same j target) and were still not merged, while both arms' else-blocks WERE
    merged. cross_jump for a simplejump only compares jumps found through
    jump_chain[JUMP_LABEL(insn)], so two jumps at the same ADDRESS but on
    different label rtx are never candidates; do_cross_jump's get_label_before
    plus the jump-to-jump tensioning at jump.c:1712 is what decides whether the
    surviving label is shared. So the escape is label identity, which no source
    form addresses directly. Do not re-attempt R1 by permuting the arm bodies —
    they must stay identical to match.

func_titlescreen_8007ABAC:
  verdict: parked
  class: "qty_sugg_compare live-range tie (a1 to the constant vs to the pointer), caused by the D_8007A6D8 a3 load stealing sched1's T-6"
  date: 2026-08-25
  note: >-
    8588 B, 7/2147 linked. FULL MECHANISM READ OFF `cc1 -dS` THIS SESSION (see
    the .wip header; do not re-derive). rank_for_schedule already ranks the
    -0x40000 lui ahead of the D_800785E8 load at T-7; schedule_select overrides
    it because potential_hazard is 0 for a lui and >0 for a load, so the load is
    placed last, born last, has the shorter live range, and qty_sugg_compare
    (equal single a1 suggestions) hands IT a1. Arm 2 of the same expression
    matches because its block has no third boosted load; arm 1's is the
    D_8007A6D8 a3 argument, whose arg copy always wins the T-4 LUID tie (
    expand_call emits arg copies a0..a3 in order). Proved by construction:
    passing a literal 0 for a3 reproduces the original's registers first build.
    Two levers reach the right registers and both cost more than they buy:
    (1) A195 R=3 on the const — any loop note in this block lifts the outgoing
    stack-arg store into the top priority group (loop_notes sets
    reg_pending_sets_all, so the note insn and everything after inherit priority
    >=2) where potential_hazard gives a store the last slot: 10-11/2147 over six
    placements. GENERAL RULE: no A195 dial is usable in a block that passes a
    stack argument. (2) F14 un-boost of the a3 load via a multi-set carrier —
    7/2147 with only a 4-insn a0/a3 load swap left in arm 1 plus 3 in the donor
    arm, but an un-boosted def always drifts to the block front, so the swap is
    structural. Donor rule learned: a second set that is a CONSTANT ARGUMENT is
    deleted by copy propagation (carrier stays single-set, silently); `tbl = K;
    <global> = tbl;` survives. RETIRED: "no source form makes sched1 emit the
    pointer before the constant" — lever 2 does. Still open: a third real
    reference to the const with no loop note, or a copy suggestion / second hard
    reg suggestion (qty_sugg_compare sorts on suggestion counts before priority).

