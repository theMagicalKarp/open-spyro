# Persistent triage verdicts — merged over the auto-heuristics by `open-spyro triage`.
#
# One entry per function, append-only from match sessions. Format (constrained
# YAML subset — keep to exactly this shape, the parser is deliberately small):
#
#   FunctionName:
#     verdict: wall            # wall | parked | attempted | viable
#     class: "B9 clamp"        # cookbook wall / tie class
#     date: 2026-07-23
#     note: "free text"
#
# wall      = never attempt (documented toolchain wall); removed from candidates.
# parked    = a .c.wip exists or the residue is a named tie class; harvest mode.
# attempted = tried and abandoned without a full wall diagnosis; score penalty.
# viable    = hand-vouched good candidate; score boost.
#
# Auto-detected blockers (%gp_rel, $at literal loads, BIOS trampolines,
# switchdata jr-tables in main, handwritten tags) need no entry here.

