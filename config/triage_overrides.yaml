    volatile init store pins it above the branch, and a plain init store makes
    the STORE the closest eligible filler instead (reorg takes it, and sched2
    then hoists the lui/lw over it, losing the load-delay nop). The original's
    loop traffic (lw/addiu/sw/lw per iteration) requires the memory-resident
    budget; the original's ra placement requires a NON-volatile init store.
    Those two are mutually exclusive in our source set. Not a permuter target:
    randomizing statements cannot change which insn first touches the frame.

